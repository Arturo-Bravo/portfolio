<div class="projects p-4">
	<div *ngFor="let project of projects">
		<div class="project row" (click)="selectProj(project)">
			<div [id]="project.pic" class="title col-8"></div>
			<div class="title-text px-2 col-4">
				{{project.name}}
			</div>
		</div>
	</div>
</div>

<div *ngIf="theProject" class="pop">
	<div class="feature">
		<div class="close" (click)="closeProj()">
			<mat-icon>close</mat-icon>
		</div>
		<div class="">
			{{theProject.name}}
		</div>
		<div class="">
			{{theProject.desc}}
		</div>
		<div class="skills">
			<div *ngFor="let tag of theProject.tags" [className]="tag.color" >
				{{tag.skill}}
			</div>
		</div>	
		<div *ngIf="theProject.link">
			<a href="{{theProject.link}}" target="_blank">Link To Site</a>
		</div>
	</div>	
</div>
