<div class="projects p-4 toBlur">
	<div *ngFor="let project of projects" class="project row justify-content-center" >
			<img [src]="project.pic" [id]="project.pic" class="title col-8" alt="{{project.name}} image" (click)="selectProj(project)">
			<div class="title-text px-2 col-4" (click)="selectProj(project)">
				{{project.name}}
			</div>
	</div>
</div>

<div *ngIf="theProject" class="pop">
	<div class="" id="feature">
		<div>
			<mat-icon class="close" (click)="closeProj()">close</mat-icon>
		</div>
		<div class="p-4">
			<div class="h2">
				{{theProject.name}}
			</div>
			<img [src]="theProject.pic" alt="{{theProject.name}} thumbnail" class="thumb">
			<div class="mt-2" [innerHtml]="theProject.desc">
			</div>
			<div class="mt-2 h3">
				Technologies Used:
			</div>
			<div class="skills mb-2">
				<div *ngFor="let tag of theProject.tags" [className]="tag.color" >
					{{tag.skill}}
				</div>
			</div>	
			<a *ngIf="theProject.link"  href="{{theProject.link}}" target="_blank" class="link">Link To Site </a>
		</div>	
	</div>	
</div>
