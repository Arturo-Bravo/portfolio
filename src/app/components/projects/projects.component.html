<div class="projects p-4 toBlur back layers container-fluid">
	<div *ngFor="let project of projects" class="project col-12 col-md-10 justify-content-center container-fluid" (click)="selectProj(project)">
		<div class="row d-flex justify-content-center">
			<img [src]="project.pic" [id]="project.pic" class="title col-8 col-md-6" alt="{{project.name}} image" >
			<div class="title-text col-4" >
				{{project.name}}
			</div>
		</div>
	</div>
</div>

<div *ngIf="theProject" class="pop">
	<div class="position-relative" id="feature">
		<div>
			<mat-icon class="close" (click)="closeProj()">close</mat-icon>
		</div>
		<div class="p-4 position-relative">
			<div class="h2">
				{{theProject.name}}
			</div>
			<img [src]="theProject.pic" alt="{{theProject.name}} thumbnail" class="thumb">
			<div class="mt-2" [innerHtml]="theProject.desc">
			</div>
			<div class="mt-2 h3">
				Technologies Used:
			</div>
			<div class="skills mb-2">
				<div *ngFor="let tag of theProject.tags" [className]="tag.color" >
					{{tag.skill}}
				</div>
			</div>	
			<a *ngIf="theProject.link"  href="{{theProject.link}}" target="_blank" class="link"> <span>Link To Site</span></a>
			<br>
			<a href="{{theProject.gitLink}}" target="_blank" class="link"><span>Link To Repo</span></a>
		</div>	
	</div>	
</div>
